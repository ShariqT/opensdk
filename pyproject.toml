[project]
name = "opensdkv2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shariq Torres", email = "shariq.torres@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "flask>=3.1.3",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "langchain>=1.4.4",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "openai>=3.24.0",
    "operators>=1.0.1",
    "platformdirs>=4.12.4",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "typing-extensions>=4.16.0",
]

[project.scripts]
opensdk = "opensdkv2:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"
